        <meta name="description" content="">

        <link rel="stylesheet" href="">

           href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
 
</script>

    <body>
     <div class="jumbotron jumbotron-fluid"></div>
        <div class="container">        
         <h1>Welcome to my stydy progress dash board</h1>
         <p>Her you can see the results</p>
         <button class="btn btn-success">Computer</button>
         <button class="btn btn-primary">Math</button>
         <button class="btn btn-info">English</button>
         <button class="btn btn-danger">Urdu</button>
        </div>
        </div>
        <div class="container">
        <h2> First Monthly Tests<span class="badge badge-warning">4</span></h2>
        <h4>Computer<span class="badge badge-success">Mark,s = 20/20</span></h4>
        <h4>Math<span class="badge badge-primary">Mark,s = 18/20</span></h4>

        <h4>Urdu<span class="badge badge-warning">Mark,s = 15/20</span></h4>

         <h2>Progress Bar</h2>
         <h4>Computer</h4>
         <div class="progress-bar badge-success" style="width: 100%;">
            100%
         </div>
        </div> 
        <h4>Math</h4>       
        <div class="progress-bar badge-primary" style="width: 80%;">
            80%
        </div>
        <h4>English</h4>
        <div class="progress-bar badge-info" style="width: 60%;">
            60%
        </div>
        <h4>Urdu</h4>
        <div class="progress-bar badge-warning" style="width: 50%;">
            50%
        </div>
