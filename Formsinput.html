<!DOCTOTYPE html>
<html>
    <head>
        <title>Forms in html</title>
    </head>
    <body>
        <h1>Form for paitent</h1>
        <p>Kindly fill this form</p>
        <form>
            <fieldset>
                <legend>Personal details</legend>
                <label>Your name:</label>
                <input type="text" placeholder="Write your name"><br>
                <label>Your paitent ID</label>
                <input type="Password" placeholder="your private ID"><br>
                <label>Date of birth</label>
                <input type="Date">
            </fieldset>
            <fieldset>
                <legend>Your visit</legend>
                <label>Choose your doctor</label>
                <select>
                    <option>Dr.Abubakar </option>
                    <option>Dr.Ali</option>
                    <option>Dr.Fatima</option>
                </select>
                <label>Why you are visiting</label>

                <input type="radio"> Fewer
                <input type="radio"> Cough
                <input type="radio"> Pain 
                <input type="radio"> Headache
                <input type="radio"> Margain

            </fieldset>
            <fieldset>
                <legend><h1>Choose your day.</h1></legend>
                <label><h3>Which day you want to come<h3></h3></label>
                <input type="checkbox"> Monday
                <input type="checkbox"> Tuesday
                <input type="checkbox"> Wednesday
                <input type="checkbox">Thursday
                <paragraph><h3>Notice:Friday,Saturday,Sunday will be off !</h3></paragraph>
            </fieldset>
        </form>
        <textarea>Im having headeache 69</textarea>
        <button type="submit">Submit my form </button>
        <hr>   
    </body>   
</html>
