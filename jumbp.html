<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>jumbotron</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <link rel="stylesheet"
           href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

</script>
    </head>
    <body>
       <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>Welcome to Science Lab</h1>
            <p>Here you can seethe results</p>
            <button class="btn btn-success">Chemistry</button>
            <button class="btn btn-info">Phisics</button>
            <button class="btn btn-danger">Biology</button>

        </div>
       </div>
       <div class="container">
        <h2>Total Experiment<span class="badge badge-danger">3</span></h2>
        <h4>Biology<span class="badge badge-warning">7 Experiment</span></h4>
        <h4>Phisics<span class="badge badge-dark">10 Experiment</span></h4>
        <h4>Chemistry<span class="badge badge-info">9 Experiment</span></h4>

        <h2>Progress bar</h2>
        <h4>Chemistry</h4>
        <div class="progress-bar bg-success" style="width: 95%;">
            95%
        </div>
        <h4>Phisics</h4>
       <div class="progress">
        <div class="progress-bar bg-info" style="width: 80%;">
            72%
        </div>
       </div> 
        <h4>Biology</h4>
        <div class="progress">
            <div class="progress-bar bg-danger" style="width: 35%;">
                30%
            </div>
        </div>

    </body>
</html>
